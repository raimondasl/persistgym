[project]
name = "persistgym"
version = "0.0.1"
description = "When does the agent harness change success, not just cost? PersistGym-lite, the ARC path study and StateCarry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "bambi>=0.21.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tiktoken>=0.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "persistgym", "harnesses", "analysis", "arc", "common"]
norecursedirs = ["arc/upstream", ".venv", "results", "drafts"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["arc/upstream"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
